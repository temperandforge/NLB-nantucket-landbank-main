  #   env:
  #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: actions/setup-node@v6
  #       with:
  #         cache: npm
  #         node-version-file: .nvmrc
  #     - run: npm ci
  #     # Vercel's project settings (root directory, env vars) drive the build.
  #     - run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
  #     - run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
  #     - run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  studio:
    name: Deploy Sanity Studio
    runs-on: ubuntu-latest
    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      SANITY_STUDIO_STUDIO_HOST: ${{ vars.SANITY_STUDIO_STUDIO_HOST }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .nvmrc
      - run: npm ci
      - run: npx sanity deploy --yes
        working-directory: studio
